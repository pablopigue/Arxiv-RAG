[project]
name = "arxiv-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.3,<3",
    "fastapi>=0.143.3",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: style errors and warnings
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import ordering
    "B",       # flake8-bugbear: likely bugs and design problems
    "UP",      # pyupgrade: modern Python syntax
    "SIM",     # flake8-simplify: simpler equivalent code
]

[tool.ruff.lint.per-file-ignores]
# Entry points add the project root to sys.path before importing src.*,
# so their imports can't all be at the top of the file.
"scripts/*" = ["E402"]
"eval/*" = ["E402"]
"src/app/streamlit_app.py" = ["E402"]
